<!doctype html>
<html>
  <head>
    <title>Ruleset Styles</title>
    <style>
      #mrJones {
        color: burlywood !important;
      }

      h1,
      h2,
      h3,
      h4 {
        color: green;
        font-size: 30px;
        background-color: darkorange;
      }
      h1 {
        color: coral;
        color: rgba(177, 53, 33, 0.5);
      }
      .uppercase {
        text-transform: uppercase;
        color: hotpink !important;
        background-color: black;
      }

      .important {
        color: orchid;
      }

      #theOne {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1 class="uppercase">Heading <span id="theOne">One</span></h1>
    <h2 class="important uppercase">Heading 2</h2>
    <h3>Heading 3</h3>
    <h4 class="important">Heading 4</h4>
    <h1 class="important">Heading 1</h1>
    <h2>Heading 2</h2>
    <h3 class="important uppercase" id="mrJones" style="color: blueviolet">
      Heading 3
    </h3>
    <h4>Heading 4</h4>
  </body>
</html>
